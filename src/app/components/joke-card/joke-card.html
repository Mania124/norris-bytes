<div
  class="bg-gradient-to-r from-gray-800 to-gray-700 rounded-xl p-6 shadow-2xl border border-gray-600 cursor-pointer hover:shadow-yellow-500/20 transition-all duration-300 hover:scale-105"
  (click)="jokeClicked.emit(joke())">
  @if (showCategory() && category()) {
    <div class="text-center mb-4">
      <h3 class="text-xl font-bold text-yellow-400 mb-2">
        Category: {{ category() | titlecase }}
      </h3>
      <div class="w-24 h-1 bg-gradient-to-r from-yellow-400 to-red-500 mx-auto rounded-full"></div>
    </div>
  }

  <div class="text-center">
    <blockquote class="text-lg md:text-xl font-medium leading-relaxed text-gray-100 italic">
      "{{ joke().value }}"
    </blockquote>
  </div>
</div>
